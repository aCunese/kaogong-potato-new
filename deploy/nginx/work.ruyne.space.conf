# ==============================================================================
# Nginx Hardened Configuration for work.ruyne.space
# 考公工作台生产独立反向代理 (企业级红蓝对抗纵深加固版)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Cloudflare 真实 IP 还原模块 (必须配置，否则限流与日志将全面失真)
# ------------------------------------------------------------------------------
# Cloudflare IPv4 CIDR
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6 CIDR
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# 从 CF-Connecting-IP 提取客户端真实 IP 并启用递归核验
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ------------------------------------------------------------------------------
# 2. 恶意爬虫与扫描器 User-Agent 识别表
# ------------------------------------------------------------------------------
map $http_user_agent $bad_bot {
    default 0;
    ~*(sqlmap|nikto|gobuster|dirsearch|wpscan|masscan|zgrab|nmap|acunetix|havij|censys|shodan) 1;
    ~*(ahrefs|semrush|mj12bot|dotbot|bytespider) 1;
}

# ------------------------------------------------------------------------------
# 3. 限流内存区定义 (此时 $binary_remote_addr 已经为真实的客户端 IP)
# ------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_general_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth_zone:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=addr_conn_zone:10m;

# ------------------------------------------------------------------------------
# 4. 默认兜底 Server (阻断公网 IP 扫描与恶意 SNI 探测，防止源站泄漏)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444; # 非法请求直接掐断 TCP 连接
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    
    # Nginx 1.19.4+ 支持在非法握手时直接拒绝，杜绝暴露正式域名证书与主机指纹
    ssl_reject_handshake on;
}

# ------------------------------------------------------------------------------
# 5. 考公工作台正式服务 Server
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name work.ruyne.space;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name work.ruyne.space;

    # 隐藏 Nginx 真实版本号
    server_tokens off;

    # 防御慢速拒绝服务 (Slowloris)
    client_body_timeout 12s;
    client_header_timeout 12s;
    send_timeout 12s;
    keepalive_timeout 30s;

    # 单 IP 最大保持 30 个并发连接
    limit_conn addr_conn_zone 30;

    # 官方 Let's Encrypt 证书
    ssl_certificate /etc/letsencrypt/live/work.ruyne.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/work.ruyne.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 请求缓冲区安全限制
    client_max_body_size 50M;
    client_body_buffer_size 1M;

    # 拦截恶意扫描器与爬虫 User-Agent
    if ($bad_bot = 1) {
        return 403;
    }

    # 拦截危险 HTTP 方法
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS|DELETE)$) {
        return 405;
    }

    # --------------------------------------------------------------------------
    # 阻断常见敏感文件、目录与源码探测 (扩大覆盖面)
    # --------------------------------------------------------------------------
    location ~* (^|/)\.(git|svn|env|docker|vscode|idea|DS_Store|bash_|aws|ssh) {
        return 404;
    }

    location ~* \.(sqlite|db|wal|shm|sql|bak|sh|conf|ini|log|old|orig|save|swp|gz|tar|tgz|zip|7z|keystore|jks|map)$ {
        return 404;
    }

    location ~* (wp-admin|wp-login|phpmyadmin|admin\.php|config\.json|package\.json|Dockerfile) {
        return 404;
    }

    # ACME 证书续订
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Gzip 压缩优化
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon;

    # 统一全局严格安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --------------------------------------------------------------------------
    # 路由代理配置
    # --------------------------------------------------------------------------
    
    # Service Worker 及版本探测：禁止浏览器与代理端长期强缓存
    location ~* ^/(sw\.js|version\.json)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # 前端哈希静态资源长效缓存 (1年，immutable)
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # 认证端点防爆破限流 (3r/s, burst=6 nodelay)
    location ~* ^/api/auth/(login|register|reset-password) {
        limit_req zone=api_auth_zone burst=6 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # APK 安装包限速防刷
    location = /api/download/apk {
        limit_conn addr_conn_zone 2;
        limit_rate 3m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate, private" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # API 接口统一限制
    location /api/ {
        limit_req zone=api_general_zone burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
    }

    # 前端 SPA 默认兜底与严格 CSP
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none';" always;
    }
}
